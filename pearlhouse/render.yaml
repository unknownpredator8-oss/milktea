services:
  - type: web
    name: pearlhouse-pos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: SQLITE_PATH
        value: /var/data/pearlhouse.db
    disk:
      name: pearlhouse-data
      mountPath: /var/data
      sizeGB: 1
